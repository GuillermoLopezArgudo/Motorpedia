services:
  db:
    image: postgres:16-alpine
    container_name: motorpedia-db
    environment:
      POSTGRES_USER: motorpedia
      POSTGRES_PASSWORD: motorpedia
      POSTGRES_DB: motorpedia
    ports:
      - "5432:5432"
    volumes:
      - motorpedia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorpedia -d motorpedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motorpedia_pg:
